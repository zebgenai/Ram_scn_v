# Remote Files (screen version) — SEPARATE server block for the existing Clever
# Campus nginx. Mounted as /etc/nginx/conf.d/remote-files-scn.conf (a DIFFERENT
# filename from the original remote-files.conf, so both coexist).
#
# An exact server_name beats the *.clevercampus.cloud wildcard, so tenants and the
# existing files.clevercampus.cloud are unaffected. The wildcard cert already
# covers this name. Change "scn.clevercampus.cloud" below if you want another name
# (also change PUBLIC_URL in .env to match).

server {
    listen 80;
    server_name scn.clevercampus.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name scn.clevercampus.cloud;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 10m;

    # Resolve the upstream at request time via Docker's DNS. With a plain
    # proxy_pass hostname, nginx would refuse to START if the server were down —
    # taking Clever Campus down with it. This keeps nginx safe either way.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $remote_files_scn_upstream http://remote-files-scn-server:8080;

    location / {
        proxy_pass $remote_files_scn_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Agents long-poll for ~25s; give headroom.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}

